[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heart"
version = "0.1.0"
description = "H.E.A.R.T. - Human-like Emotional Architecture: A next-generation AI emotional cognition system"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/Nortaq-PlayNexus/heart"
Repository = "https://github.com/Nortaq-PlayNexus/heart"

[tool.setuptools.packages.find]
include = ["heart*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
